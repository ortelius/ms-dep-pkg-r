---
name: 01 - Build Container Image

"on":
  workflow_dispatch:
    inputs:
      image_name:
        description: "Container image name"
        required: true
      image_tag:
        description: "Image tag"
        required: true
      registry:
        description: "Container registry"
        required: true
        default: "ghcr.io"
      dockerfile_path:
        description: "Path to Dockerfile"
        required: false
        default: "./Dockerfile"
      build_context:
        description: "Docker build context"
        required: false
        default: "."
      ref:
        description: "Git reference to build"
        required: false
        default: "main"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.QUAY_USERID }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
          provenance: true
          sbom: false

      - name: Output build info
        run: |
          cat > build-image.json << EOL
          {
            "digest": "${{ steps.build.outputs.digest }}",
            "image_url": "${{ inputs.registry }}/${{ inputs.image_name }}@${{ steps.build.outputs.digest }}",
            "image_tag": "${{ inputs.image_tag }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOL
          cat build-image.json

      - name: Upload build output
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: build-image-${{ github.run_id }}
          path: |
            build-image.json
          retention-days: 30
